<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Symbole FyxBot transparent</title>
  <desc id="desc">Un F arrondi avec une visière lumineuse, protégé par un bouclier rouge et orange.</desc>
  <defs>
    <linearGradient id="brand" x1="210" y1="170" x2="810" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="0.48" stop-color="#ff5a2a"/>
      <stop offset="1" stop-color="#e83220"/>
    </linearGradient>
    <linearGradient id="visor" x1="452" y1="323" x2="635" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb072"/>
      <stop offset="1" stop-color="#fff2d6"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M512 94c164 0 309 57 358 128v286c0 197-144 349-358 422C298 857 154 705 154 508V222c49-71 194-128 358-128Z" fill="url(#brand)"/>
  <path d="M512 166c134 0 245 42 282 91v247c0 155-108 277-282 341-174-64-282-186-282-341V257c37-49 148-91 282-91Z" fill="#151013"/>

  <g fill="url(#brand)">
    <rect x="300" y="252" width="176" height="510" rx="88"/>
    <rect x="332" y="242" width="402" height="188" rx="94"/>
    <rect x="332" y="454" width="318" height="144" rx="72"/>
  </g>

  <rect x="414" y="292" width="270" height="90" rx="45" fill="#241921"/>
  <rect x="452" y="323" width="194" height="28" rx="14" fill="url(#visor)" filter="url(#softGlow)"/>
  <path d="M329 735c31 30 68 45 112 45 47 0 89-19 126-58-17 79-60 137-129 174-54-27-91-81-109-161Z" fill="#e83220" opacity=".55"/>
</svg>
